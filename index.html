<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakordo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
</head>

<body>
    <canvas id="animation-canvas"></canvas>
    
    <div id="hero-section" class="hero-section">
        <header class="hero-header">
            <div class="logo-container">
                <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="#00F397"/>
                    <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="Satoshi, sans-serif" font-weight="700" font-size="18" fill="#fff">R</text>
                </svg>
                <span class="logo-text">Rakordo</span>
            </div>
        </header>
        
        <main class="hero-content">
            <!-- <div class="hero-badge">
                <span class="badge-dot"></span>
                Coming Soon
            </div> -->
            <div class="hero-visual">
                <div class="capybara-placeholder">
                    <img src="image.png" alt="capybara" class="capybara-img">
                </div>
            </div>
            <h1 class="hero-title">
                Coming <span class="gradient-text">Soon</span>
            </h1>
            
            <p class="hero-description">
From Complexity to Clarity
            </p>
            
            <div class="hero-cta">
                <div class="email-input-group">
                    <input type="email" placeholder="Enter your email" class="email-input">
                    <button class="notify-btn">Get Notified</button>
                </div>
                <p class="cta-subtext">Be the first to know when we launch.</p>
            </div>
            
            
        </main>
        
        <footer class="hero-footer">
            <p>&copy; 2026 Rakordo. All rights reserved.</p>
        </footer>
    </div>

    <script type="module" src="./script.js"></script>
</body>

</html>
